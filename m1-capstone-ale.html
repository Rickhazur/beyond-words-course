<style>

  .hidden{ display:none !important; }
  .center{ text-align:center; }
  footer{ text-align:center; color: var(--muted); font-size: 15px; padding: 0 16px 34px; }

  { id:"c1",  lesson:"Lección 1", text:"By the way,",            note:"<b>By the way</b> sirve para agregar un dato extra sin cambiar de tema." },

const CHUNK_BY_ID = {};
CHUNKS.forEach(function(c){ CHUNK_BY_ID[c.id] = c; });

/* Turnos. options: distractores de la MISMA lección por chunk.

  { id:"T1.1", act:1, speaker:"Max",

  { id:"T1.6", act:1, speaker:"Max",
    line:"Critics are divided. Some say your portraits are pure poetry. Others say… celebrity gossip with good lighting.",

  { id:"T1.7", act:1, speaker:"Max", stage:"(Max baja la voz)",

  { id:"T1.8", act:1, speaker:"Max",

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function actUnlocked(act){
  if(act===1) return true;
  if(act===2) return !!S.acts["1"].best;
  if(act===3) return !!S.acts["2"].best;
  return false;
}
function bestScore(){ let t=0; [1,2,3].forEach(function(a){ if(S.acts[String(a)].best) t += S.acts[String(a)].best.score; }); return t; }

function chunkResultFromBest(cid){
  for(let a=1;a<=3;a++){ const b = S.acts[String(a)].best; if(b && b.chunks && b.chunks[cid]) return b.chunks[cid]; }

}
/* Normalización tolerante: minúsculas, sin puntuación, palabras */
function normWords(s){
  return String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/['’.,;:!?…"“”"()\-—–]/g," ").replace(/\s+/g," ").trim().split(" ").filter(Boolean);
}
function findSeq(hay, needle){
  for(let i=0;i+needle.length<=hay.length;i++){ let ok=true; for(let j=0;j<needle.length;j++){ if(hay[i+j]!==needle[j]){ ok=false; break; } } if(ok) return i; }
  return -1;
}
/* Actos 1–2: el chunk debe aparecer al inicio (se tolera una frase breve antes, como en los modelos).
   Acto 3: en cualquier punto de la respuesta. */
function chunkFoundIn(cid, transcript, act){
  const words = normWords(transcript); const cw = normWords(CHUNK_BY_ID[cid].text);
  const idx = findSeq(words, cw);
  if(idx<0) return false;
  if(act===3) return true;
  return idx <= 13;
}

function onSelfCheck(val){

  else {
    evalMap[pending[0]] = (val==="both" || val==="only-first");

  }

function startRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  try{
    const recog = new SR();
    recog.lang = "en-US"; recog.interimResults = false; recog.maxAlternatives = 3;
    RT.recording = true; RT.recError = false; renderTurn();
    recog.onresult = function(ev){
      RT.recording = false;
      const alts = [];
      for(let i=0;i<ev.results[0].length;i++) alts.push(ev.results[0][i].transcript);
      RT.lastTranscript = alts[0] || "";
      const t = RT.turn;
      const pending = t.chunks.filter(function(cid){ return !RT.scored[cid]; });
      const evalMap = {};
      if(pending.length===2){
        pending.forEach(function(cid){ evalMap[cid] = false; });
        alts.forEach(function(tr){
          const w = normWords(tr);
          const cw1 = normWords(CHUNK_BY_ID[pending[0]].text);
          const cw2 = normWords(CHUNK_BY_ID[pending[1]].text);
          const i1 = findSeq(w, cw1);
          const ok1 = i1>=0 && (t.act===3 || i1<=13);
          let ok2 = false;
          if(i1>=0){ const rest = w.slice(i1 + cw1.length); ok2 = findSeq(rest, cw2) >= 0; }
          if(ok1) evalMap[pending[0]] = true;
          if(ok2) evalMap[pending[1]] = true;
        });
      } else {
        pending.forEach(function(cid){ evalMap[cid] = alts.some(function(tr){ return chunkFoundIn(cid, tr, t.act); }); });
      }
      evaluateProduction(evalMap);
    };
    recog.onerror = function(){ if(RT){ RT.recording = false; RT.recError = true; renderTurn(); } };
    recog.onend = function(){ if(RT && RT.recording){ RT.recording = false; renderTurn(); } };
    recog.start();
  }catch(e){ RT.recording = false; RT.recError = true; renderTurn(); }
}
/* ---------- Puntaje y retroalimentación ---------- */
function scoreChunk(cid){
  let cap = 10;
  if(RT.hint>=2) cap = 8;
  if(RT.hint>=3) cap = 5;
  if(RT.prodFailed[cid]) cap = Math.min(cap, RT.turn.act===3 ? 5 : 7);
  if(RT.choiceRevealed[cid]) cap = Math.min(cap, 7);
  const firstTry = !RT.prodFailed[cid] && !(RT.choiceWrongs[cid]>0) && !RT.buildHadWrong;
  const repasar = RT.hint>=3 || !!RT.prodFailed[cid] || !!RT.choiceRevealed[cid];
  return { score: cap, firstTry: firstTry, repasar: repasar };
}
function evaluateProduction(evalMap){
  RT.lastEval = evalMap;
  Object.keys(evalMap).forEach(function(cid){
    if(evalMap[cid]){ if(!RT.scored[cid]) RT.scored[cid] = scoreChunk(cid); }
    else RT.prodFailed[cid] = true;
  });
  RT.step = "feedback"; RT.selfCheckOpen = false;
  renderTurn();
}

function finishTurn(){

      '<button class="btn btn-ghost" data-testid="to-cover">Ir al menú</button>' +
      '<button class="btn btn-soft" data-testid="golden-start">🔁 Rehacer el Discurso de Oro</button>' +
    '</div></div>';
}

/* =====================================================================
   NAVEGACIÓN (delegación de clics)
   ===================================================================== */
app.addEventListener("click", function(ev){
  const t = ev.target;
  const actStart = t.closest("[data-act-start]");
  if(actStart){ const a = parseInt(actStart.getAttribute("data-act-start"), 10); if(actUnlocked(a)) renderActIntro(a); return; }
  const testidEl = t.closest("[data-testid]");
  if(testidEl){
    const id = testidEl.getAttribute("data-testid");
    if(id==="to-cover"){ renderCover(); return; }
    if(id==="reset-all"){ if(window.confirm("¿Borrar TODO tu avance de esta actividad?")){ S = defaultState(); saveState(); renderCover(); } return; }
    if(id==="act-begin"){ const a = parseInt(testidEl.getAttribute("data-act"), 10); if(!S.run || S.run.act!==a){ S.run = { act:a, turnIdx:0, results:{} }; saveState(); } startTurn(); return; }
    if(id==="repeat-act"){ const a = parseInt(testidEl.getAttribute("data-act"), 10); S.run = { act:a, turnIdx:0, results:{} }; saveState(); renderActIntro(a); return; }
    if(id==="next-act"){ renderActIntro(parseInt(testidEl.getAttribute("data-act"), 10)); return; }
    if(id==="golden-start"){ renderGolden(); return; }
    if(id==="final-open"){ renderFinal(); return; }
    if(id==="btn-responder"){ RT.phase = "main"; renderTurn(); return; }
    if(id==="hint-show"){ RT.hint = 1; renderTurn(); return; }
    if(id==="hint-more"){ if(RT.hint<3) RT.hint++; renderTurn(); return; }
    if(id==="check-blocks"){ onCheckBlocks(); return; }
    if(id==="clear-blocks"){ RT.builtIdx = []; refreshBuildArea(); return; }
    if(id==="btn-record"){ if(RT && !RT.recording) startRecording(); return; }
    if(id==="btn-selfcheck"){ RT.selfCheckOpen = true; renderTurn(); return; }
    if(id==="btn-retry"){ RT.step = "produce"; RT.selfCheckOpen = false; RT.lastEval = null; renderTurn(); return; }
    if(id==="btn-next"){ finishTurn(); return; }
    if(id==="golden-model"){ stashGoldenInputs(); goldenShowModel = !goldenShowModel; renderGolden(); return; }
    if(id==="golden-record"){ startGoldenRecording(); return; }
    if(id==="golden-save"){ onGoldenSave(); return; }
  }
  const opt = t.closest(".opt-btn");
  if(opt){ onChoice(opt); return; }
  const blk = t.closest(".blk-btn");
  if(blk && !blk.disabled){ RT.builtIdx.push(parseInt(blk.getAttribute("data-bi"), 10)); refreshBuildArea(); return; }
  const sc = t.closest("[data-sc]");
  if(sc){ onSelfCheck(sc.getAttribute("data-sc")); return; }
});

/* Inicio */
updateHUD();
renderCover();

</script>
</body>
</html>
